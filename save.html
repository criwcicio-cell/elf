  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse at top, #1f6b4a, #0f3d2e 60%, #0a2a20); color: #fff;
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
  main { max-width: 480px; margin: 0 auto; padding: calc(18px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom)); }
  .logo { width: 96px; height: 96px; border-radius: 50%; box-shadow: 0 6px 18px rgba(0,0,0,.35); }
  h1 { font: 700 26px/1.2 CCPoppins, system-ui, sans-serif; margin: 10px 0 2px; }

  video { width: 100%; max-height: 62vh; aspect-ratio: 9 / 16; object-fit: contain; background: #000; border-radius: 16px; border: 4px solid #fff; margin: 14px 0 10px; display: block; }
  video.hidden, .hidden { display: none !important; }
  .btn { display: block; width: 100%; border: 3px solid #fff; border-radius: 999px; padding: 15px 18px; margin: 10px 0; color: #fff; cursor: pointer;
    font: 700 21px CCPoppins, system-ui, sans-serif; background: linear-gradient(#2fbf62, #1a8c45); box-shadow: 0 5px 0 rgba(0,0,0,.3); }
  .btn.photo { background: linear-gradient(#ff5a64, #c81e32); font-size: 18px; }
  .btn:disabled { opacity: .55; }
  .tip { font-size: 15px; opacity: .92; margin: 6px 0; }
  .loading { margin: 30px 0; font-size: 18px; }
  .spin { display: inline-block; font-size: 46px; animation: s 1s linear infinite; } @keyframes s { to { transform: rotate(360deg); } }
  a { color: #f7c531; }
  .foot { margin-top: 22px; font-size: 14px; opacity: .85; }
</style>

      catch (e) { if (i === 2) throw e; await new Promise(r => setTimeout(r, 1200 * (i + 1))); }
    }
  };
  const getFile = async f => {
    const j = await getJSON(`${api}?action=get&id=${encodeURIComponent(f.id)}`);
    const blob = await (await fetch(`data:${j.mimeType};base64,${j.data}`)).blob();
    return new File([blob], j.name || f.name, { type: j.mimeType || f.mimeType });
  };

  try {
    const list = await getJSON(`${api}?action=list&folderId=${encodeURIComponent(folderId)}`);
    const video = list.files.find(f => /^video\//.test(f.mimeType));
    if (!video) return fail('Your video isn\'t there yet – try again in a minute.');
    if (video) {
      $('loadText').textContent = `Getting your video… (${(video.size / 1048576).toFixed(1)} MB)`;
      files.video = await getFile(video);
      const v = $('vid'); v.src = URL.createObjectURL(files.video); v.classList.remove('hidden'); v.play().catch(() => {});
      $('saveVideo').classList.remove('hidden');
    }
    $('loading').classList.add('hidden');
    $('tip').textContent = isIOS ? 'Tap Save, then choose “Save Video” to put it in your Photos.' : 'Tap Save – it goes into your Gallery / Photos (or Downloads).';
  } catch (e) {
    console.warn(e);
    fail('We couldn\'t load your video just now. Check your internet, then scan the QR code again.');
  }

  // iPhone/iPad: the share menu has "Save Video" / "Save Image" (into Photos). Android & others: download.
  async function save(file) {
    if (!file) return;
    if (isIOS && navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); return; } catch (e) { if (e.name === 'AbortError') return; }
    }
    const url = URL.createObjectURL(file), a = document.createElement('a');
    a.href = url; a.download = file.name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    $('tip').textContent = '✅ Saved! Look in your Gallery / Photos (or Downloads).';
  }
  $('saveVideo').onclick = () => save(files.video);
})();
</script>
</body>
</html>
